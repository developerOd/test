<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    html, body {
      margin: 0; padding: 0; overflow: hidden;
      cursor: none;
      background: transparent !important;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/webgl-fluid@0.3.9/dist/webgl-fluid.umd.js"></script>
  <script>
    const canvas = document.getElementById('canvas');
    function resize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const sim = WebGLFluid(canvas, {
      SIM_RESOLUTION:      128,
      DYE_RESOLUTION:      1440,
      CAPTURE_RESOLUTION:  512,
      DENSITY_DISSIPATION: 3.5,
      VELOCITY_DISSIPATION:2,
      PRESSURE:            0.1,
      PRESSURE_ITERATIONS:20,
      CURL:                3,
      SPLAT_RADIUS:        0.2,
      SPLAT_FORCE:         6000,
      COLOR_UPDATE_SPEED:  10,
      BACK_COLOR:          { r:0.5, g:0, b:0 },
      TRANSPARENT:         true,
      SHADING:             true,
      AUTO:                false,
      IMMEDIATE:           false
    });

    // Instead of direct pointer listeners, we handle parent→iframe messages:
    window.addEventListener('message', e => {
      const d = e.data;
      if (!d || !d.type) return;
      if (d.type === 'move') {
        // d.x, d.y, d.dx, d.dy
        sim.splat(d.x, d.y, d.dx * 5, d.dy * 5);
      }
      else if (d.type === 'down') {
        sim.splat(d.x, d.y, 0, 0);
      }
    });
  <\/script>
</body>
</html>
